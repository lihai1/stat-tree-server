# Minimal protoc builder for Go stub generation.
# Used by the orchestrator Makefile `make proto-go` target.
# Much lighter than the full builder stage in Dockerfile (no go mod / go build).
FROM golang:1.25-alpine

RUN apk add --no-cache protobuf-dev make

RUN go install google.golang.org/protobuf/cmd/protoc-gen-go@latest && \
    go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest && \
    go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@latest && \
    go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2@latest

WORKDIR /app
