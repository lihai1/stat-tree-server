databaseChangeLog:
  - changeSet:
      id: create-saved-forms-table
      author: stat-tree
      changes:
        - createTable:
            tableName: saved_forms
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                  defaultValueComputed: gen_random_uuid()
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: form_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: numbers
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: exclude_numbers
                  type: JSONB
              - column:
                  name: count
                  type: INTEGER
              - column:
                  name: analysis_type
                  type: VARCHAR(50)
              - column:
                  name: generated_result
                  type: JSONB
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            constraintName: fk_saved_forms_user_id
            baseTableName: saved_forms
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
        - createIndex:
            indexName: idx_saved_forms_user_id
            tableName: saved_forms
            columns:
              - column:
                  name: user_id
