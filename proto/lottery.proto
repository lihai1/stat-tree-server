syntax = "proto3";

package lottery.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/lihai1/stat-tree-server/pkg/gen;lotteryv1";

// Java package for generated stubs.
option java_package = "com.statistiloto.lottery.v1";
option java_multiple_files = true;

// LotteryService is the contract between the Java BFF and the Go
// lottery-stats-server. The Go service owns the tree-based analysis engine
// (internal/lottery-tree) and the lottery_results store. It is stateless
// beyond the historical draws table: no user data, no saved forms.
service LotteryService {
  // HealthCheck returns the health status of the service.
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse) {
    option (google.api.http) = {
      get: "/health"
    };
  }

  // GenerateForm generates lottery number combinations based on
  // historical-draw patterns over an optional date window.
  rpc GenerateForm(GenerateFormRequest) returns (GenerateFormResponse) {
    option (google.api.http) = {
      post: "/api/generate/form"
      body: "*"
    };
  }

  // GetStatistics calculates frequent number pairs/groups over a date window.
  rpc GetStatistics(GetStatisticsRequest) returns (GetStatisticsResponse) {
    option (google.api.http) = {
      post: "/api/generate/pares"
      body: "*"
    };
  }

  // Analyze evaluates user-selected numbers against historical winning draws.
  rpc Analyze(AnalyzeRequest) returns (AnalyzeResponse) {
    option (google.api.http) = {
      post: "/api/generate/analyze"
      body: "*"
    };
  }

  // Simulate backtests a user's numbers against historical draws over a date
  // window, computing ticket cost spent and prizes won per draw and in total.
  // Supports systematic forms (6, 8, 10, 12 numbers) where all C(N,6)
  // combinations are played per draw.
  rpc Simulate(SimulateRequest) returns (SimulateResponse) {
    option (google.api.http) = {
      post: "/api/generate/simulate"
      body: "*"
    };
  }
}

// Strength selects whether strong-ball statistics are used.
enum Strength {
  STRENGTH_UNSPECIFIED = 0;
  WEAK = 1;
  STRONG = 2;
}

// DateWindow is an optional historical-draw window. If both bounds are unset
// the service uses the full archive.
message DateWindow {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
}

// GenerateFormRequest mirrors the original FormCalculations model.
message GenerateFormRequest {
  // howMany combinations to generate.
  int32 how_many = 1;
  // Lottery form type/variant (matches original `type` field).
  int32 form_type = 2;
  // Numbers the user wants included in every generated form ("willBe").
  repeated int32 will_be = 3;
  // Optional historical window. Unset = full archive.
  DateWindow window = 4;
  // Strength mode for statistics-aware generation.
  Strength strength = 5;
}

// NumberSet is one generated combination (regular numbers + optional strong).
message NumberSet {
  repeated int32 numbers = 1;
  optional int32 strong = 2;
}

// GenerateFormResponse is a list of generated combinations.
message GenerateFormResponse {
  repeated NumberSet forms = 1;
}

// GetStatisticsRequest mirrors the original statsCalculations model.
message GetStatisticsRequest {
  // how many pairs/groups to compute.
  int32 how_many = 1;
  // Lottery form type/variant.
  int32 form_type = 2;
  // Optional historical window.
  DateWindow window = 3;
  // Strength mode (strong/weak pair statistics).
  Strength strength = 4;
}

// Pair is a frequent number group with its occurrence count.
message Pair {
  repeated int32 numbers = 1;
  int32 count = 2;
}

// GetStatisticsResponse is the list of frequent pairs/groups.
message GetStatisticsResponse {
  repeated Pair pairs = 1;
}

// AnalyzeRequest mirrors the original FormAnalyzeCalculations model.
message AnalyzeRequest {
  // The user's selected numbers to evaluate.
  repeated int32 form = 1;
  // Optional historical window.
  DateWindow window = 2;
}

// AnalyzeResponse is the analysis of the user's form against history.
message AnalyzeResponse {
  // Grouped frequency results, one entry per group size (1–6).
  // Each group contains the number combinations of that size and their
  // occurrence counts, mirroring the legacy 2D-array analyze output.
  repeated FrequencyGroup frequency_groups = 1;
  // Number of historical draws used for the analysis (archive size).
  int32 archive_size = 2;
}

// FrequencyEntry is one number combination and its occurrence count.
message FrequencyEntry {
  // The numbers in this combination (length = group size).
  repeated int32 numbers = 1;
  // How many times this combination appeared in the archive.
  int32 count = 2;
}

// FrequencyGroup holds all frequency entries for a specific group size.
message FrequencyGroup {
  // Group size: 1 = single number, 2 = pair, 3 = triple, etc.
  int32 size = 1;
  // Total possible combinations for this group size (C(37, size)).
  int32 combos = 2;
  // Frequency entries in this group, sorted by count descending.
  repeated FrequencyEntry entries = 3;
}

// HealthCheckRequest is an empty request for health check.
message HealthCheckRequest {}

// HealthCheckResponse contains the health status of the service.
message HealthCheckResponse {
  string status = 1;
  string version = 2;
  int32 draws_loaded = 3;
}

// ── Simulate (backtest) ───────────────────────────────────────────

// SimulateRequest backtests a user's form against historical draws.
// The form may contain 6, 8, 10, or 12 numbers (systematic forms).
// For N > 6, all C(N,6) combinations are played per draw.
message SimulateRequest {
  // The user's selected numbers (6, 8, 10, or 12 for systematic forms).
  repeated int32 form = 1;
  // The user's strong number (1-7). 0 = no strong number.
  int32 strong = 2;
  // Optional historical window. Unset = full archive.
  DateWindow window = 3;
  // Ticket cost per table/combination in ILS. Default 3.0.
  double ticket_cost = 4;
  // User-configurable prize amounts per tier (ILS). If empty, service
  // defaults are used. Index 0 = tier 1 (6+strong), ..., 7 = tier 8 (3).
  // Must be length 0 or 8.
  repeated double prize_amounts = 5;
}

// SimulateTierHit records how many combinations hit a specific prize tier
// in a single draw.
message SimulateTierHit {
  // Prize tier 1-8 (1 = 6+strong, 8 = 3 matches).
  int32 tier = 1;
  // Number of combinations that hit this tier in this draw.
  int32 hits = 2;
  // Prize amount per hit (ILS).
  double amount_per_hit = 3;
  // Total prize for this tier in this draw (hits × amount_per_hit).
  double total = 4;
}

// SimulateDrawResult is the simulation result for a single historical draw.
message SimulateDrawResult {
  int32 draw_number = 1;
  google.protobuf.Timestamp draw_date = 2;
  repeated int32 winning_numbers = 3;
  int32 winning_strong = 4;
  // Prize tiers hit in this draw (may be multiple for systematic forms).
  repeated SimulateTierHit tier_hits = 5;
  // Total prize won in this draw (ILS).
  double prize_won = 6;
  // Ticket cost for this draw (ILS).
  double ticket_cost = 7;
  // True when the prize amounts used for this draw came from the scraped
  // per-draw prize data (lottery_results.prize_amounts). False when the
  // service fell back to default estimates or user-supplied overrides.
  bool used_real_prizes = 8;
}

// SimulateTierSummary is the aggregated summary for a single prize tier
// across all simulated draws.
message SimulateTierSummary {
  // Prize tier 1-8.
  int32 tier = 1;
  // Human-readable label (e.g. "6+strong", "5", "3+strong").
  string label = 2;
  // Total number of combinations that hit this tier across all draws.
  int32 total_hits = 3;
  // Total prize amount for this tier across all draws (ILS).
  double total_amount = 4;
}

// SimulateSummary is the aggregated summary over all simulated draws.
message SimulateSummary {
  int32 total_draws = 1;
  int32 total_combinations = 2;
  double total_spent = 3;
  double total_won = 4;
  // Net profit/loss (total_won - total_spent) in ILS.
  double net = 5;
  // Per-tier summaries (always 8 entries, tiers 1-8).
  repeated SimulateTierSummary tier_summaries = 6;
  // Number of draws whose prize amounts came from scraped per-draw data
  // (rather than default estimates or user overrides).
  int32 draws_with_real_prizes = 7;
}

// SimulateResponse is the response from the Simulate RPC.
message SimulateResponse {
  // Per-draw results, ordered by draw_date ascending.
  repeated SimulateDrawResult draws = 1;
  SimulateSummary summary = 2;
}
